name: quality

on:
  pull_request:
  push:
    branches: [main, master]
  # The distribution-candidate scope installs the pinned models and runs every
  # suite, so it is started on purpose and never gates a pull request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knowledge-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Update runner CA store
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
          dpkg-query -W ca-certificates
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: bun test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run contract:check
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Audit shipped frontend dependencies
        working-directory: frontend
        run: pnpm audit --prod --audit-level high
      - working-directory: frontend
        run: pnpm test:run
      - working-directory: frontend
        run: pnpm typecheck
      - working-directory: frontend
        run: pnpm lint

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Update runner CA store
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
          dpkg-query -W ca-certificates
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: |
          sh scripts/bootstrap-python.sh python
          pip install --no-cache-dir --no-deps --require-hashes -r requirements-torch.txt
          pip install --no-cache-dir --require-hashes -r requirements-lock.txt
          pip install --no-cache-dir --no-deps ./docling ./packages/docling-azure-ocr
          pip install --no-cache-dir --no-deps --no-build-isolation -e .
      - name: Audit locked Python dependencies
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --no-cache-dir pip-audit==2.10.1
          /tmp/audit/bin/pip-audit -r requirements-lock.txt --disable-pip --no-deps
      - name: Install MCP integration for guide and transport checks
        run: pip install -r integrations/mcp/requirements.txt
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install knowledge API dependencies for MCP ingestion acceptance
        working-directory: knowledge-api
        run: bun install --frozen-lockfile
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Build frontend resources for Python tests
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm export:static
      - name: Verify installed wheel and resources
        run: python scripts/verify_package.py
      - name: Install pinned models
        env:
          PYTHONPATH: src
        run: python scripts/download_models.py
      - name: Offline checks
        env:
          PYTHONPATH: src:packages/docling-azure-ocr/src
        run: |
          python -m ruff check . --exclude docling --exclude qa
          python -m ruff format --check . --exclude docling --exclude qa
          python -m ty check src packages/docling-azure-ocr/src --error-on-warning
          DOCLING_ENV_FILE=/dev/null python -m pytest tests -q
          python -m docling_desk.operations.tool_guides
          python -m docling_desk.operations.models

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Update runner CA store
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
          dpkg-query -W ca-certificates
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: |
          sh scripts/bootstrap-python.sh python
          pip install --no-cache-dir --no-deps --require-hashes -r requirements-torch.txt
          pip install --no-cache-dir --require-hashes -r requirements-lock.txt
          pip install --no-cache-dir --no-deps ./docling ./packages/docling-azure-ocr
          pip install --no-cache-dir --no-deps --no-build-isolation -e .
      - name: Install MCP for installed-package connection acceptance
        run: pip install -r integrations/mcp/requirements.txt
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the distributed frontend
        id: frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm export:static
      - name: Install the browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: HTTP upload, search, context, and delete
        id: http
        env:
          PYTHONPATH: src:packages/docling-azure-ocr/src
        run: python -m pytest tests/test_distribution_http.py -q
      - name: Synthetic browser checks
        id: browser
        working-directory: frontend
        env:
          UI_SYNTHETIC: "1"
          DOCLING_PYTHON: python
          CI: "true"
        run: pnpm test:e2e:synthetic
      - name: Record the commit and what did not run
        if: always()
        env:
          PYTHONPATH: src:packages/docling-azure-ocr/src
        run: |
          python -m docling_desk.operations.distribution_evidence \
            --commit "${GITHUB_SHA}" \
            --frontend-build "${{ steps.frontend.outcome }}" \
            --http "${{ steps.http.outcome }}" \
            --browser "${{ steps.browser.outcome }}" \
            --docker not_run \
            --azure not_run \
            --saved-documents not_run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: distribution-evidence
          path: qa/distribution/latest.json

  distribution-candidate:
    # Runs `operations.verify --scope distribution`: all suites, the frontend
    # build, the synthetic browser run, the installed package and HTTP checks,
    # with the pinned models required. Docker, Azure and saved documents stay
    # not_run and are recorded as such. A declared job is not a result: the
    # outcome is the uploaded verify.json and distribution-evidence.json.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Update runner CA store
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
          dpkg-query -W ca-certificates
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: |
          sh scripts/bootstrap-python.sh python
          pip install --no-cache-dir --no-deps --require-hashes -r requirements-torch.txt
          pip install --no-cache-dir --require-hashes -r requirements-lock.txt
          pip install --no-cache-dir --no-deps ./docling ./packages/docling-azure-ocr
          pip install --no-cache-dir --no-deps --no-build-isolation -e .
          pip install -r integrations/mcp/requirements.txt
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install knowledge API dependencies
        working-directory: knowledge-api
        run: bun install --frozen-lockfile
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies and the browser
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Install pinned models
        env:
          PYTHONPATH: src
        run: python scripts/download_models.py
      - name: Distribution-candidate verification
        env:
          PYTHONPATH: src:packages/docling-azure-ocr/src
          CI: "true"
        run: python -m docling_desk.operations.verify --scope distribution --output qa/refactoring/ci/verify.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: distribution-candidate-verification
          path: qa/refactoring/ci/
